<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每週市場回顧 Weekly Market Wrap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f0f2f5;
    color: #333;
    line-height: 1.6;
  }
  .header {
    background: linear-gradient(135deg, #1B3A5C 0%, #2E75B6 100%);
    padding: 48px 20px 40px;
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
  .header .subtitle { color: rgba(255,255,255,0.85); font-size: 16px; }
  .header .stats { margin-top: 12px; color: rgba(255,255,255,0.7); font-size: 13px; }
  .container { max-width: 820px; margin: 0 auto; padding: 0 16px 40px; }
  .report-list { display: grid; gap: 14px; }
  .report-card {
    background: #fff;
    border-radius: 10px;
    padding: 18px 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
    border-left: 4px solid #2E75B6;
  }
  .report-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.13);
  }
  .card-left .week-tag {
    display: inline-block;
    background: #2E75B6;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    margin-bottom: 6px;
  }
  .card-left .period {
    font-size: 15px;
    font-weight: 600;
    color: #1B3A5C;
  }
  .card-right {
    font-size: 13px;
    color: #2E75B6;
    font-weight: 600;
    white-space: nowrap;
    margin-left: 16px;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 16px;
  }
  .footer {
    text-align: center;
    padding: 32px 20px;
    color: #999;
    font-size: 13px;
    line-height: 1.8;
  }
  .footer a { color: #2E75B6; text-decoration: none; }
</style>
</head>
<body>
<div class="header">
  <h1>每週市場回顧 Weekly Market Wrap</h1>
  <div class="subtitle">美股 A股 港股 商品 外匯 加密貨幣 | 週報精選</div>
  <div class="stats">每週日北京時間 9:00 自動生成 | Yahoo Finance API 核驗</div>
</div>
<div class="container">
  <div class="report-list" id="list">
    <div class="empty" id="empty">正在載入報告列表...</div>
  </div>
</div>
<div class="footer">
  每週市場回顧 &copy; 2026 Steven學長<br>
  <a href="https://github.com/stevenhchang/weekly-market-wrap">GitHub Repo</a>
</div>
<script>
  fetch('reports.json')
    .then(r => r.json())
    .then(reports => {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      if (!reports.length) {
        empty.innerHTML = '<p>暫無報告，敬請期待！</p>';
        return;
      }
      empty.remove();
      // 最新在前
      [...reports].reverse().forEach(r => {
        const a = document.createElement('a');
        a.href = r.file;
        a.className = 'report-card';
        a.innerHTML = `
          <div class="card-left">
            <div class="week-tag">${r.week}</div>
            <div class="period">${r.period}</div>
          </div>
          <div class="card-right">查看報告 →</div>
        `;
        list.appendChild(a);
      });
    })
    .catch(() => {
      document.getElementById('empty').innerHTML = '<p>暫無報告，敬請期待！</p>';
    });
</script>
</body>
</html>
